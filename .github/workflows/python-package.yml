# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv (Unix)
        if: runner.os != 'Windows'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash
        
      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        run: iwr https://astral.sh/uv/install.ps1 -useb | iex
        shell: pwsh

      - name: Add uv to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Create virtual environment
        run: uv venv

      - name: Install packages (Unix)
        if: runner.os != 'Windows'
        run: source .venv/bin/activate && uv pip install -e ".[dev]"
        shell: bash
        
      - name: Install packages (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\activate && uv pip install -e ".[dev]"
        shell: cmd

      - name: Check formatting with ruff (Unix)
        if: runner.os != 'Windows'
        run: source .venv/bin/activate && ruff format --check .
        shell: bash

      - name: Check formatting with ruff (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\activate && ruff format --check .
        shell: cmd

      - name: Lint with ruff (Unix)
        if: runner.os != 'Windows'
        run: source .venv/bin/activate && ruff check .
        shell: bash

      - name: Lint with ruff (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\activate && ruff check .
        shell: cmd

      - name: Type checking with mypy (Unix)
        if: runner.os != 'Windows'
        run: source .venv/bin/activate && mypy --strict .
        shell: bash

      - name: Type checking with mypy (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\activate && mypy --strict .
        shell: cmd

      - name: Test with pytest (Unix)
        if: runner.os != 'Windows'
        run: source .venv/bin/activate && pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=mediawikiapi --cov-fail-under=82
        shell: bash

      - name: Test with pytest (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\activate && pytest --junitxml=pytest.xml --cov-report=term-missing:skip-covered --cov=mediawikiapi --cov-fail-under=82
        shell: cmd
