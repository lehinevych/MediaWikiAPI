[project]
name = "mediawikiapi"
version = "2.0"
description = "Wikipedia API on Python"
authors = [
    {name = "Taras Lehinevych", email = "info@taraslehinevych.me"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.11.1",
    "requests>=2.28.1",
]

[project.optional-dependencies]
docs = ["sphinx>=7.2.6"]
dev = [
    "mypy>=1.15.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "autoflake>=2.3.1",
    "flake8>=7.1.2",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-vcr>=1.0.2",
    "typing-extensions>=4.12.2",
    "types-beautifulsoup4>=4.12.0.20250204",
    "types-requests>=2.32.0.20250306",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 88

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
