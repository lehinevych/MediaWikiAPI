[project]
name = "mediawikiapi"
version = "2.0"
description = "Wikipedia API on Python"
authors = [
    {name = "Taras Lehinevych", email = "info@taraslehinevych.me"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.11.1",
    "requests>=2.28.1",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
docs = ["sphinx>=7.2.6"]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=6.0.0",
    "pytest-vcr>=1.0.2",
    "typing-extensions>=4.12.2",
    "types-beautifulsoup4>=4.12.0.20250204",
    "types-requests>=2.32.0.20250306",
    "types-aiohttp>=3.9.13",
]

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "B", "S", "A", "C4", "PT", "RUF", "SIM", "ARG", "ERA"]
ignore = ["E203"]
fixable = ["ALL"]
unfixable = []
pycodestyle.max-doc-length = 88

[tool.ruff.lint.isort]
known-first-party = ["mediawikiapi"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
